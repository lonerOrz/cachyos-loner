name: Setup Build Environment
description: Checkout, free disk, swap, install Nix, and setup noci cache

inputs:
  checkout-token:
    description: GitHub token for checkout
    required: false
  gh-token:
    description: GitHub token for nix access-tokens
    required: true
  noci-signing-key:
    description: Noci cache signing key
    required: true
  sandbox-fallback:
    description: Nix sandbox fallback setting
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/checkout@v6
      with:
        token: ${{ inputs.checkout-token || '' }}

    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main

    - name: Add Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 20

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          accept-flake-config = true
          sandbox-fallback = ${{ inputs.sandbox-fallback }}
          access-tokens = github.com=${{ inputs.gh-token }}

    - name: Setup noci cache
      uses: lonerOrz/noci/action@main
      with:
        repo: ${{ github.repository }}
        signing-key: ${{ inputs.noci-signing-key }}
        token: ${{ inputs.gh-token }}
