name: Bump
on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *"

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            access-tokens = github.com=${{ secrets.GH_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "cachyos-loner[bot]"
          git config user.email "cachyos-loner[bot]@users.noreply.github.com"

      - name: Run Centralized Updates Orchestrator
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          BRANCH_NAME="bump-all-packages"
          git checkout -B "$BRANCH_NAME"
          BASE_SHA=$(git rev-parse HEAD)

          nix run .#update --impure

          if [ "$(git rev-parse HEAD)" != "$BASE_SHA" ]; then
            git push origin "$BRANCH_NAME" --force

            PR_NUMBER=$(gh pr list --head "$BRANCH_NAME" --state open --json number --jq '.[0].number // empty')

            if [ -z "$PR_NUMBER" ]; then
              gh pr create \
                --title "bump(cachyos): automated kernels and drivers update" \
                --body "Automated routine update for all active CachyOS kernels, NVIDIA drivers, and modules." \
                --base main \
                --head "$BRANCH_NAME"
            else
              LAST_COMMIT=$(git log -1 --pretty=%s)
              gh pr comment "$PR_NUMBER" --body "This pull request has been updated with new changes: \`${LAST_COMMIT}\`."
            fi
          fi
