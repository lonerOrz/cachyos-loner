name: Bump

on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Daily automated version check, bump, and PR creation.
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            access-tokens = github.com=${{ secrets.GH_TOKEN }}

      - uses: lonerOrz/noci/action@v1.5.0
        with:
          repo: ${{ github.repository }}
          signing-key: ${{ secrets.NOCI_SIGNING_KEY }}
          token: ${{ secrets.GH_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "cachyos-loner[bot]"
          git config user.email "cachyos-loner[bot]@users.noreply.github.com"

      - name: Run Centralized Updates Orchestrator
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          BRANCH_NAME="bump-all-packages"
          git checkout -B "$BRANCH_NAME"
          BASE_SHA=$(git rev-parse HEAD)

          # Run centralized update script across kernels and drivers.
          nix run .#update --impure -- --commit

          # Check if commits were created or if working tree changed.
          if [[ "$(git rev-parse HEAD)" != "$BASE_SHA" || -n "$(git status --porcelain)" ]]; then
            # Cleanly commit any remaining untracked changes if needed.
            if [[ -n "$(git status --porcelain)" ]]; then
              git add .
              git commit -m "chore(auto-bump): update generated snapshots"
            fi

            git push origin "$BRANCH_NAME" --force

            COMMIT_LIST=$(git log --pretty=format:"* %s" "$BASE_SHA"..HEAD)

            PR_BODY=$(cat <<EOF
          Automated routine update for active CachyOS kernels and NVIDIA drivers.

          ### Updated Components in this PR:
          $COMMIT_LIST

          > Note: Unchanged or failed components will be retried automatically in the next scheduled run.
          EOF
          )

            PR_NUMBER=$(gh pr list --head "$BRANCH_NAME" --state open --json number --jq '.[0].number // empty')

            if [[ -z "$PR_NUMBER" ]]; then
              gh pr create \
                --title "bump(cachyos): automated kernels and drivers update" \
                --body "$PR_BODY" \
                --base main \
                --head "$BRANCH_NAME"
            else
              gh pr edit "$PR_NUMBER" --body "$PR_BODY"

              COMMENT_BODY=$(cat <<EOF
          This pull request has been updated with the following changes:

          $COMMIT_LIST
          EOF
          )
              gh pr comment "$PR_NUMBER" --body "$COMMENT_BODY"
            fi
          fi
