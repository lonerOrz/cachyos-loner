name: Check
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  validate-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            access-tokens = github.com=${{ secrets.GH_TOKEN }}
      - name: Validate variant list matches flavors.nix
        run: |
          EXPECTED=$(nix eval .#needCacheDrvs.x86_64-linux --json | jq -r '.kernels | keys[]' | sed 's/^linux_cachyos-//' | sort)
          MATRIX=$(echo '["gcc", "hardened", "lto", "lto-znver4", "lts", "rc", "server"]' | jq -r '.[]' | sort)
          if ! diff <(echo "$EXPECTED") <(echo "$MATRIX"); then
            echo "::error::Variant matrix in check.yml is out of sync with flavors.nix"
            exit 1
          fi

  check:
    needs: validate-matrix
    strategy:
      matrix:
        variant: [gcc, lto, lto-znver4, server, hardened, lts, rc]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            access-tokens = github.com=${{ secrets.GH_TOKEN }}

      - uses: lonerOrz/noci/action@main
        with:
          repo: ${{ github.repository }}
          signing-key: ${{ secrets.NOCI_SIGNING_KEY }}
          token: ${{ secrets.GH_TOKEN }}

      - name: Verify Kernel Configuration and Patches
        run: nix build .#linux_cachyos-${{ matrix.variant }}.configfile -L --impure

  # Variant → checked-in config-nix file. Keep in sync with config-nix/ directory.
  config-nix-check:
    needs: validate-matrix
    strategy:
      matrix:
        include:
          - variant: gcc
            config_file: cachyos-gcc.x86_64-linux.nix
          - variant: lto
            config_file: cachyos-lto.x86_64-linux.nix
          - variant: lto-znver4
            config_file: cachyos-znver4.x86_64-linux.nix
          - variant: server
            config_file: cachyos-server.x86_64-linux.nix
          - variant: hardened
            config_file: cachyos-hardened.x86_64-linux.nix
          - variant: rc
            config_file: cachyos-rc.x86_64-linux.nix
          - variant: lts
            config_file: cachyos-lts.x86_64-linux.nix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            sandbox-fallback = false
            access-tokens = github.com=${{ secrets.GH_TOKEN }}

      - uses: lonerOrz/noci/action@main
        with:
          repo: ${{ github.repository }}
          signing-key: ${{ secrets.NOCI_SIGNING_KEY }}
          token: ${{ secrets.GH_TOKEN }}

      - name: Build kconfigToNix
        run: nix build .#linux_cachyos-${{ matrix.variant }}.kconfigToNix -L --impure

      - name: Diff against checked-in config-nix
        run: |
          if [ "${{ matrix.config_file }}" = "cachyos-znver4.x86_64-linux.nix" ]; then
            nix eval --impure --json --expr 'import ./linux-cachyos/config-nix/cachyos-znver4.x86_64-linux.nix' | \
              jq -r 'to_entries | .[] | "  \"\(.key)\" = \"\(.value)\";"' | sort > /tmp/expected
            sed '1d;$d' result | sort > /tmp/actual
            diff /tmp/expected /tmp/actual
          else
            diff <(cat result) linux-cachyos/config-nix/${{ matrix.config_file }}
          fi

  check-summary:
    needs: [check, config-nix-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate check results
        run: |
          echo "check: ${{ needs.check.result }}"
          echo "config-nix-check: ${{ needs.config-nix-check.result }}"

          if [ "${{ needs.check.result }}" != "success" ] || [ "${{ needs.config-nix-check.result }}" != "success" ]; then
            echo "::error::One of the config checks failed."
            exit 1
          fi
          echo "All checks passed"
