name: Build and Cache

on:
  workflow_dispatch:
    inputs:
      gcc:
        type: boolean
        default: true
      lto:
        type: boolean
        default: true
      server:
        type: boolean
        default: true
      hardened:
        type: boolean
        default: true
      lts:
        type: boolean
        default: true
      rc:
        type: boolean
        default: true
      lto-znver4:
        description: "Zen4-specific LTO variant"
        type: boolean
        default: true
      run_gc:
        description: "Run Garbage Collection after build"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      kernels_matrix: ${{ steps.matrix.outputs.kernels }}
      extras_matrix: ${{ steps.matrix.outputs.extras }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            access-tokens = github.com=${{ secrets.GH_TOKEN }}

      - id: matrix
        shell: bash
        run: |
          nix eval .#needCacheDrvs.x86_64-linux --json > "$RUNNER_TEMP/need_cache.json"

          ENABLED_VARIANTS=()
          [[ "${{ inputs.gcc }}" == "true" ]] && ENABLED_VARIANTS+=("gcc")
          [[ "${{ inputs.lto }}" == "true" ]] && ENABLED_VARIANTS+=("lto")
          [[ "${{ inputs.server }}" == "true" ]] && ENABLED_VARIANTS+=("server")
          [[ "${{ inputs.hardened }}" == "true" ]] && ENABLED_VARIANTS+=("hardened")
          [[ "${{ inputs.lts }}" == "true" ]] && ENABLED_VARIANTS+=("lts")
          [[ "${{ inputs.rc }}" == "true" ]] && ENABLED_VARIANTS+=("rc")
          [[ "${{ inputs.lto-znver4 }}" == "true" ]] && ENABLED_VARIANTS+=("lto-znver4")

          ENABLED_JSON=$(jq -n --args '$ARGS.positional' -- "${ENABLED_VARIANTS[@]}" -c)

          KERNELS=$(jq -n \
            --argjson all "$(cat "$RUNNER_TEMP/need_cache.json")" \
            --argjson enabled "$ENABLED_JSON" \
            '
              $all.kernels | to_entries
              | map(select(.value.variant as $v | $enabled | index($v)))
              | group_by(.value.drvPath) | map(.[0].key)
            ' -c)

          NVIDIA=$(jq -n \
            --argjson all "$(cat "$RUNNER_TEMP/need_cache.json")" \
            --argjson enabled "$ENABLED_JSON" \
            '
              $all.nvidia | to_entries
              | map(select(.value.variant as $v | $enabled | index($v)))
              | group_by(.value.drvPath) | map(.[0].key)
            ' -c)

          MODULES=$(jq -n \
            --argjson all "$(cat "$RUNNER_TEMP/need_cache.json")" \
            --argjson enabled "$ENABLED_JSON" \
            '
              $all.modules | to_entries
              | map(select(.value.variant as $v | $enabled | index($v)))
              | group_by(.value.drvPath) | map(.[0].key)
            ' -c)

          EXTRAS=$(jq -n \
            --argjson nvidia "$NVIDIA" \
            --argjson modules "$MODULES" \
            '($nvidia | map({ package: ., type: "nvidia" })) + ($modules | map({ package: ., type: "module" }))' -c)

          printf 'kernels=%s\n' "$KERNELS" >> "$GITHUB_OUTPUT"
          printf 'extras=%s\n' "$EXTRAS" >> "$GITHUB_OUTPUT"

  build-kernels:
    needs: prepare
    if: needs.prepare.outputs.kernels_matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.prepare.outputs.kernels_matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: jlumbroso/free-disk-space@v1.3.1

      - uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 20

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            access-tokens = github.com=${{ secrets.GH_TOKEN }}

      - uses: lonerOrz/noci/action@v1.5.0
        with:
          repo: ${{ github.repository }}
          signing-key: ${{ secrets.NOCI_SIGNING_KEY }}
          token: ${{ secrets.GH_TOKEN }}

      - name: Build Kernel
        run: nix build .#${{ matrix.package }} -L --impure

  build-extras:
    needs: [prepare, build-kernels]
    if: ${{ !failure() && !cancelled() && needs.prepare.outputs.extras_matrix != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.extras_matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: jlumbroso/free-disk-space@v1.3.1

      - uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 20

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            access-tokens = github.com=${{ secrets.GH_TOKEN }}

      - uses: lonerOrz/noci/action@v1.5.0
        with:
          repo: ${{ github.repository }}
          signing-key: ${{ secrets.NOCI_SIGNING_KEY }}
          token: ${{ secrets.GH_TOKEN }}

      - name: Build Extra Component
        run: nix build .#${{ matrix.package }} -L --impure
        continue-on-error: ${{ matrix.type == 'module' }}

  cleanup:
    needs: [build-kernels, build-extras]
    if: always() && github.event.inputs.run_gc == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            access-tokens = github.com=${{ secrets.GH_TOKEN }}

      - name: Run noci GC
        run: |
          nix run github:lonerOrz/noci -- gc \
            --repo ${{ github.repository }} \
            --grace-period 168h \
            --dry-run=false \
            --physical-sweep
        env:
          NOCI_TOKEN: ${{ secrets.GH_TOKEN }}
