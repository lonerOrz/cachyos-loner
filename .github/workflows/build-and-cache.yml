name: Build and Cache

on:
  workflow_dispatch:
    inputs:
      gcc: { type: boolean, default: true }
      lto: { type: boolean, default: true }
      server: { type: boolean, default: true }
      hardened: { type: boolean, default: true }
      lts: { type: boolean, default: true }
      rc: { type: boolean, default: true }
      run_gc:
        description: "Run Garbage Collection after build"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        shell: bash
        run: |
          variants=()
          [[ "${{ inputs.gcc }}" == "true" ]] && variants+=('"gcc"')
          [[ "${{ inputs.lto }}" == "true" ]] && variants+=('"lto"')
          [[ "${{ inputs.server }}" == "true" ]] && variants+=('"server"')
          [[ "${{ inputs.hardened }}" == "true" ]] && variants+=('"hardened"')
          [[ "${{ inputs.lts }}" == "true" ]] && variants+=('"lts"')
          [[ "${{ inputs.rc }}" == "true" ]] && variants+=('"rc"')
          printf 'matrix=[%s]\n' "$(IFS=,; echo "${variants[*]}")" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        variant: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main

      - name: Add Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 20

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            access-tokens = github.com=${{ secrets.GH_TOKEN }}

      - name: Setup noci cache
        uses: lonerOrz/noci/action@main
        with:
          repo: ${{ github.repository }}
          signing-key: ${{ secrets.NOCI_SIGNING_KEY }}
          token: ${{ secrets.GH_TOKEN }}

      - name: Build Targets
        run: |
          nix build .#"linux_cachyos-${{ matrix.variant }}" -L
          nix build .#"nvidia_cachyos-${{ matrix.variant }}" -L

  cleanup:
    needs: build
    if: ${{ github.event.inputs.run_gc == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Run noci GC
        run: |
          nix run github:lonerOrz/noci -- gc \
            --repo ${{ github.repository }} \
            --max-size 10GB \
            --grace-period 168h \
            --dry-run=false \
            --physical-sweep
        env:
          NOCI_TOKEN: ${{ secrets.GH_TOKEN }}
