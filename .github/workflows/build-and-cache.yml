name: 构建并推送到 OCI Nix 缓存

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-cache:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            sandbox-fallback = false
            access-tokens = github.com=${{ secrets.GH_TOKEN }}

      - name: 设置 Cachix 缓存
        uses: cachix/cachix-action@v16
        with:
          name: loneros
          extraPullNames: nix-community

      - name: 安装 noci 工具
        run: nix profile install github:lonerOrz/noci

      - name: 智能构建并推送缓存至 OCI
        env:
          NOCI_SIGNING_KEY: ${{ secrets.NOCI_SIGNING_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          noci push .#linux_cachyos-gcc

      - name: 执行自动化垃圾回收
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          noci gc --max-size 5GB --grace-period 6h --dry-run=false
