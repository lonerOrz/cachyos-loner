name: Build and Cache

on:
  workflow_dispatch:
    inputs:
      gcc:
        type: boolean
        default: true
      lto:
        type: boolean
        default: true
      server:
        type: boolean
        default: true
      hardened:
        type: boolean
        default: true
      lts:
        type: boolean
        default: true
      rc:
        type: boolean
        default: true
      run_gc:
        description: "Run Garbage Collection after build"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      kernels_matrix: ${{ steps.matrix.outputs.kernels }}
      modules_matrix: ${{ steps.matrix.outputs.modules }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            access-tokens = github.com=${{ secrets.GH_TOKEN }}

      - id: matrix
        shell: bash
        run: |
          nix eval .#needCacheDrvs.x86_64-linux --json > "$RUNNER_TEMP/need_cache.json"

          ENABLED_VARIANTS=()
          [[ "${{ inputs.gcc }}" == "true" ]] && ENABLED_VARIANTS+=("gcc")
          [[ "${{ inputs.lto }}" == "true" ]] && ENABLED_VARIANTS+=("lto")
          [[ "${{ inputs.server }}" == "true" ]] && ENABLED_VARIANTS+=("server")
          [[ "${{ inputs.hardened }}" == "true" ]] && ENABLED_VARIANTS+=("hardened")
          [[ "${{ inputs.lts }}" == "true" ]] && ENABLED_VARIANTS+=("lts")
          [[ "${{ inputs.rc }}" == "true" ]] && ENABLED_VARIANTS+=("rc")

          ENABLED_JSON=$(jq -n --args '$ARGS.positional' -- "${ENABLED_VARIANTS[@]}" -c)

          KERNELS=$(jq -n \
            --argjson all "$(cat "$RUNNER_TEMP/need_cache.json")" \
            --argjson enabled "$ENABLED_JSON" \
            '
              $all.kernels | to_entries
              | map(select(
                  .key as $k |
                  $enabled[] as $var |
                  ($k | contains("-" + $var)) or
                  ($k | contains("cachyos-" + $var)) or
                  ($var == "gcc" and (($k | split(".") | last) == "linux_cachyos"))
              ))
              | group_by(.value) | map(.[0].key)
            ' -c)

          MODULES=$(jq -n \
            --argjson all "$(cat "$RUNNER_TEMP/need_cache.json")" \
            --argjson enabled "$ENABLED_JSON" \
            '
              $all.modules | to_entries
              | map(select(
                  .key as $k |
                  $enabled[] as $var |
                  ($k | contains("-" + $var)) or
                  ($k | contains("cachyos-" + $var)) or
                  ($var == "gcc" and (
                    ($k | split(".")) as $parts |
                    $parts[0] == "packages" and (
                      $parts[2] == "nvidia_cachyos" or
                      $parts[2] == "nvidia_cachyos-open" or
                      $parts[2] == "zfs_cachyos"
                    )
                  ))
              ))
              | group_by(.value) | map(.[0].key)
            ' -c)

          printf 'kernels=%s\n' "$KERNELS" >> "$GITHUB_OUTPUT"
          printf 'modules=%s\n' "$MODULES" >> "$GITHUB_OUTPUT"

  build-kernels:
    needs: prepare
    if: needs.prepare.outputs.kernels_matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        package: ${{ fromJson(needs.prepare.outputs.kernels_matrix) }}
    steps:
      - uses: actions/checkout@v6

      - uses: jlumbroso/free-disk-space@main

      - uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 20

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            access-tokens = github.com=${{ secrets.GH_TOKEN }}

      - uses: lonerOrz/noci/action@main
        with:
          repo: ${{ github.repository }}
          signing-key: ${{ secrets.NOCI_SIGNING_KEY }}
          token: ${{ secrets.GH_TOKEN }}

      - name: Build Kernel
        run: nix build .#${{ matrix.package }} -L --impure

  build-modules:
    needs: [prepare, build-kernels]
    if: needs.prepare.outputs.modules_matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        package: ${{ fromJson(needs.prepare.outputs.modules_matrix) }}
    steps:
      - uses: actions/checkout@v6

      - uses: jlumbroso/free-disk-space@main

      - uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 20

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            access-tokens = github.com=${{ secrets.GH_TOKEN }}

      - uses: lonerOrz/noci/action@main
        with:
          repo: ${{ github.repository }}
          signing-key: ${{ secrets.NOCI_SIGNING_KEY }}
          token: ${{ secrets.GH_TOKEN }}

      - name: Build Module
        run: nix build .#${{ matrix.package }} -L --impure

  cleanup:
    needs: [build-kernels, build-modules]
    if: always() && (github.event.inputs.run_gc == 'true' || github.event_name == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            access-tokens = github.com=${{ secrets.GH_TOKEN }}

      - name: Run noci GC
        run: |
          nix run github:lonerOrz/noci -- gc \
            --repo ${{ github.repository }} \
            --grace-period 168h \
            --dry-run=false \
            --physical-sweep
        env:
          NOCI_TOKEN: ${{ secrets.GH_TOKEN }}
