name: Build PR

on:
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      kernels: ${{ steps.compare-drvs.outputs.kernels }}
      extras: ${{ steps.compare-drvs.outputs.extras }}
      run_build: ${{ steps.compare-drvs.outputs.run_build }}
    steps:
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            sandbox-fallback = false
            access-tokens = github.com=${{ secrets.GH_TOKEN }}

      - name: Checkout PR (Head)
        uses: actions/checkout@v6
        with:
          path: pr
          token: ${{ secrets.GH_TOKEN }}

      - name: Checkout Main (Base)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.base_ref }}
          path: base
          token: ${{ secrets.GH_TOKEN }}

      - name: Compare Derivation Paths
        id: compare-drvs
        run: |
          cd pr
          nix eval .#needCacheDrvs.x86_64-linux --json > "$RUNNER_TEMP/pr_all.json"
          cd ..

          cd base
          nix eval .#needCacheDrvs.x86_64-linux --json > "$RUNNER_TEMP/base_all.json" 2>/dev/null || echo '{"kernels": {}, "nvidia": {}, "modules": {}}' > "$RUNNER_TEMP/base_all.json"
          cd ..

          PR_JSON=$(cat "$RUNNER_TEMP/pr_all.json")
          BASE_JSON=$(cat "$RUNNER_TEMP/base_all.json")

          get_changes() {
            local category=$1
            jq -n \
              --arg cat "$category" \
              --argjson pr "$PR_JSON" \
              --argjson base "$BASE_JSON" \
              '
                ($pr[$cat] // {}) | to_entries
                | map(select(
                    .value.drvPath != (($base[$cat] // {})[.key].drvPath // "") or
                    .value.drvPath == null
                ))
                | group_by(.value.drvPath) | map(.[0].key)
              ' -c
          }

          KERNELS=$(get_changes "kernels")
          NVIDIA=$(get_changes "nvidia")
          MODULES=$(get_changes "modules")

          EXTRAS=$(jq -n \
            --argjson nvidia "$NVIDIA" \
            --argjson modules "$MODULES" \
            '($nvidia | map({ package: ., type: "nvidia" })) + ($modules | map({ package: ., type: "module" }))' -c)

          if [ "$KERNELS" = "[]" ] && [ "$EXTRAS" = "[]" ]; then
            RUN_BUILD="false"
          else
            RUN_BUILD="true"
          fi

          echo "kernels=$KERNELS" >> $GITHUB_OUTPUT
          echo "extras=$EXTRAS" >> $GITHUB_OUTPUT
          echo "run_build=$RUN_BUILD" >> $GITHUB_OUTPUT

  build-kernels:
    needs: detect
    if: needs.detect.outputs.run_build == 'true' && needs.detect.outputs.kernels != '[]'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect.outputs.kernels) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_TOKEN }}
      - uses: jlumbroso/free-disk-space@main
      - uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 20
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            sandbox-fallback = false
            access-tokens = github.com=${{ secrets.GH_TOKEN }}
      - uses: lonerOrz/noci/action@main
        with:
          repo: ${{ github.repository }}
          signing-key: ${{ secrets.NOCI_SIGNING_KEY }}
          token: ${{ secrets.GH_TOKEN }}
      - name: Build Kernel
        run: nix build .#${{ matrix.package }} -L --impure

  build-extras:
    needs: [detect, build-kernels]
    if: ${{ !failure() && !cancelled() && needs.detect.outputs.run_build == 'true' && needs.detect.outputs.extras != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.extras) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_TOKEN }}
      - uses: jlumbroso/free-disk-space@main
      - uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 20
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            sandbox-fallback = false
            access-tokens = github.com=${{ secrets.GH_TOKEN }}
      - uses: lonerOrz/noci/action@main
        with:
          repo: ${{ github.repository }}
          signing-key: ${{ secrets.NOCI_SIGNING_KEY }}
          token: ${{ secrets.GH_TOKEN }}
      - name: Build Extra Component
        run: nix build .#${{ matrix.package }} -L --impure
        continue-on-error: ${{ matrix.type == 'module' }}

  required-checks:
    if: always()
    needs: [detect, build-kernels, build-extras]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate required checks
        run: |
          echo "detect: ${{ needs.detect.result }}"
          echo "build-kernels: ${{ needs.build-kernels.result }}"
          echo "build-extras: ${{ needs.build-extras.result }}"

          if [ "${{ needs.build-kernels.result }}" = "failure" ] || [ "${{ needs.build-extras.result }}" = "failure" ]; then
            echo "::error::Required core checks failed."
            exit 1
          fi
          echo "Required checks passed"
