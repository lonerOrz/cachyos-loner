name: Build PR

on:
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      kernels: ${{ steps.compare-drvs.outputs.kernels }}
      modules: ${{ steps.compare-drvs.outputs.modules }}
      run_build: ${{ steps.compare-drvs.outputs.run_build }}
    steps:
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            sandbox-fallback = false
            access-tokens = github.com=${{ secrets.GH_TOKEN }}

      - name: Checkout PR (Head)
        uses: actions/checkout@v6
        with:
          path: pr
          token: ${{ secrets.GH_TOKEN }}

      - name: Checkout Main (Base)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.base_ref }}
          path: base
          token: ${{ secrets.GH_TOKEN }}

      - name: Compare Derivation Paths
        id: compare-drvs
        run: |
          cd pr
          nix eval .#needCacheDrvs.x86_64-linux --json > "$RUNNER_TEMP/pr_all.json"
          cd ..

          cd base
          nix eval .#needCacheDrvs.x86_64-linux --json > "$RUNNER_TEMP/base_all.json" 2>/dev/null || echo '{"kernels": {}, "modules": {}}' > "$RUNNER_TEMP/base_all.json"
          cd ..

          PR_JSON=$(cat "$RUNNER_TEMP/pr_all.json")
          BASE_JSON=$(cat "$RUNNER_TEMP/base_all.json")

          KERNELS=$(jq -n \
            --argjson pr "$PR_JSON" \
            --argjson base "$BASE_JSON" \
            '
              $pr.kernels | to_entries
              | map(select(.value != $base.kernels[.key] or .value == "error" or $base.kernels[.key] == "error"))
              | group_by(.value) | map(.[0].key)
            ' -c)

          MODULES=$(jq -n \
            --argjson pr "$PR_JSON" \
            --argjson base "$BASE_JSON" \
            '
              $pr.modules | to_entries
              | map(select(.value != $base.modules[.key] or .value == "error" or $base.modules[.key] == "error"))
              | group_by(.value) | map(.[0].key)
            ' -c)

          if [ "$KERNELS" = "[]" ] && [ "$MODULES" = "[]" ]; then
            RUN_BUILD="false"
          else
            RUN_BUILD="true"
          fi

          echo "kernels=$KERNELS" >> $GITHUB_OUTPUT
          echo "modules=$MODULES" >> $GITHUB_OUTPUT
          echo "run_build=$RUN_BUILD" >> $GITHUB_OUTPUT

  build-kernels:
    needs: detect
    if: needs.detect.outputs.run_build == 'true' && needs.detect.outputs.kernels != '[]'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        package: ${{ fromJson(needs.detect.outputs.kernels) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main

      - name: Add Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 20

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            sandbox-fallback = false
            access-tokens = github.com=${{ secrets.GH_TOKEN }}

      - name: Setup noci cache
        uses: lonerOrz/noci/action@main
        with:
          repo: ${{ github.repository }}
          signing-key: ${{ secrets.NOCI_SIGNING_KEY }}
          token: ${{ secrets.GH_TOKEN }}

      - name: Build Kernel
        run: nix build .#${{ matrix.package }} -L --impure

  build-modules:
    needs: [detect, build-kernels]
    if: ${{ !failure() && !cancelled() && needs.detect.outputs.run_build == 'true' && needs.detect.outputs.modules != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        package: ${{ fromJson(needs.detect.outputs.modules) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main

      - name: Add Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 20

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            sandbox-fallback = false
            access-tokens = github.com=${{ secrets.GH_TOKEN }}

      - name: Setup noci cache
        uses: lonerOrz/noci/action@main
        with:
          repo: ${{ github.repository }}
          signing-key: ${{ secrets.NOCI_SIGNING_KEY }}
          token: ${{ secrets.GH_TOKEN }}

      - name: Build Module
        run: nix build .#${{ matrix.package }} -L --impure
